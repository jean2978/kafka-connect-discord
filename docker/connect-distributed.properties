wwwwwwwwwwwwwwwwwww# Kafka Connect worker config for the local docker-compose setup.

bootstrap.servers=kafka:29092
group.id=connect-cluster

# REST API
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
rest.advertised.port=8083

# Plain JSON without the schema envelope, easier to produce test messages by hand
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Internal topics; replication factor 1 because there is a single broker
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

offset.flush.interval.ms=10000

# Lets connector configs use ${env:NAME}, so secrets like the bot token stay out of the REST API
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

# Each subdirectory is one plugin; ./target/plugin/discord-connector is mounted at /opt/connectors/discord-connector
plugin.path=/opt/connectors
